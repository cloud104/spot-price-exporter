# cloudbuild.yaml - multi-arch unified build & push using buildx

substitutions:
  _TAG_NAME: "latest"
  _REPO: "us-east1-docker.pkg.dev/tks-gcr-pub/spot-price-exporter/spot-price-exporter"

steps:
  # 1. Enable binfmt for cross-platform emulation
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--privileged', 'tonistiigi/binfmt:latest', '--install', 'all']

  # 2. Create and use a buildx builder
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --use --name cbuilder || docker buildx use cbuilder

  # 3. Multi-arch build (single manifest)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64,linux/arm64'
      - '--push'
      - '--tag'
      - '$_REPO:$SHORT_SHA'
      - '--tag'
      - '$_REPO:${_TAG_NAME}'
      - '--tag'
      - '$_REPO:${SHORT_SHA}-multiarch'
      - '--tag'
      - '$_REPO:${_TAG_NAME}-multiarch'
      - '--provenance=false'
      - '--sbom=false'
      - '.'

images:
  - '$_REPO:$SHORT_SHA'
  - '$_REPO:${_TAG_NAME}'
  - '$_REPO:${SHORT_SHA}-multiarch'
  - '$_REPO:${_TAG_NAME}-multiarch'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
