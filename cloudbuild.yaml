# cloudbuild.yaml - multi-arch build & push using docker buildx
substitutions:
  _TAG_NAME: "latest"

steps:
  # enable binfmt for cross-platform emulation
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--privileged', 'tonistiigi/binfmt:latest', '--install', 'all']

  # create and use a buildx builder
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --use --name cbuilder || docker buildx use cbuilder

  # buildx multi-platform build and push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64,linux/arm64'
      - '--push'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/spot-price-exporter:$SHORT_SHA'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/spot-price-exporter:latest'
      - '--provenance=false'
      - '--sbom=false'
      - '.'

  # Verificar e validar as imagens após o push
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull gcr.io/$PROJECT_ID/spot-price-exporter:$SHORT_SHA
        docker pull gcr.io/$PROJECT_ID/spot-price-exporter:latest

images:
  - 'gcr.io/$PROJECT_ID/spot-price-exporter:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/spot-price-exporter:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'