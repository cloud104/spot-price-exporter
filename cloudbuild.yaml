# Cloud Build configuration to build and push a multi-architecture image
# using Docker Buildx (linux/amd64 + linux/arm64)

substitutions:
  _IMAGE_NAME: "gcr.io/totvs-kubernetes-service/spot-price-exporter"
  _TAG_NAME: "latest"

steps:
  # 1. Enable QEMU emulation for cross-platform builds
  - name: 'gcr.io/cloud-builders/docker'
    id: 'initialize-qemu'
    args: ['run', '--privileged', 'linuxkit/binfmt:v0.7']

  # 2. Create a new Buildx builder
  - name: 'gcr.io/cloud-builders/docker'
    id: 'create-builder'
    args: ['buildx', 'create', '--name', 'multiarch-builder']

  # 3. Select the builder
  - name: 'gcr.io/cloud-builders/docker'
    id: 'select-builder'
    args: ['buildx', 'use', 'multiarch-builder']

  # 4. Inspect builder (optional but useful for logs)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'inspect-builder'
    args: ['buildx', 'inspect', '--bootstrap']

  # 5. Build and push multi-arch image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-and-push'
    args:
      [
        'buildx', 'build',
        '--platform', 'linux/amd64,linux/arm64',
        '--tag', '${_IMAGE_NAME}:${_TAG_NAME}',
        '--push',
        '.'
      ]

images:
  - '${_IMAGE_NAME}:${_TAG_NAME}'
