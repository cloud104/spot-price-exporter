# cloudbuild.yaml - Multi-arch build & push for Go binary (Dockerfile-based)

substitutions:
  _REPO: "us-east1-docker.pkg.dev/tks-gcr-pub/spot-price-exporter/spot-price-exporter"
  _TAG_NAME: "latest"

steps:
  # 1. Enable binfmt for cross-platform emulation
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--privileged', 'tonistiigi/binfmt:latest', '--install', 'all']

  # 2. Create and use a buildx builder
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --use --name cbuilder || docker buildx use cbuilder

  # 3. Build and push amd64 image with arch tag
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx build \
          --platform=linux/amd64 \
          --push \
          --tag=$_REPO:$SHORT_SHA-amd64 \
          --tag=$_REPO:$_TAG_NAME-amd64 \
          --provenance=false \
          --sbom=false \
          .

  # 4. Build and push arm64 image with arch tag
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx build \
          --platform=linux/arm64 \
          --push \
          --tag=$_REPO:$SHORT_SHA-arm64 \
          --tag=$_REPO:$_TAG_NAME-arm64 \
          --provenance=false \
          --sbom=false \
          .

  # 5. Create multi-arch manifest tags pointing to per-arch images
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx imagetools create --tag $_REPO:$SHORT_SHA \
          $_REPO:$SHORT_SHA-amd64 \
          $_REPO:$SHORT_SHA-arm64 || true

        docker buildx imagetools create --tag $_REPO:$_TAG_NAME \
          $_REPO:$_TAG_NAME-amd64 \
          $_REPO:$_TAG_NAME-arm64 || true

  # 6. List the pushed tags (no image discovery by Cloud Build)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Tags pushed:"
        gcloud artifacts docker images list ${_REPO%/*} --repository=${_REPO%/*} --location=us-east1 || true
        echo "Inspect multi-arch manifests:"
        docker buildx imagetools inspect $_REPO:$SHORT_SHA || true
        docker buildx imagetools inspect $_REPO:$_TAG_NAME || true

# Removed images: section to avoid Cloud Build "failed to find images" check
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
