# cloudbuild.yaml - multi-arch build & push with arch-specific tags

substitutions:
  _TAG_NAME: "latest"
  _REPO: "us-east1-docker.pkg.dev/tks-gcr-pub/spot-price-exporter/spot-price-exporter"

steps:
  # 1. Enable binfmt for cross-platform emulation
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--privileged', 'tonistiigi/binfmt:latest', '--install', 'all']

  # 2. Create and use a buildx builder
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --use --name cbuilder || docker buildx use cbuilder

  # 3. Build and push linux/amd64
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--platform=linux/amd64'
      - '--push'
      - '--tag=$_REPO:${SHORT_SHA}-amd64'
      - '--tag=$_REPO:${_TAG_NAME}-amd64'
      - '--provenance=false'
      - '--sbom=false'
      - '.'

  # 4. Build and push linux/arm64
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--platform=linux/arm64'
      - '--push'
      - '--tag=$_REPO:${SHORT_SHA}-arm64'
      - '--tag=$_REPO:${_TAG_NAME}-arm64'
      - '--provenance=false'
      - '--sbom=false'
      - '.'

  # 5. Create a multi-arch manifest combining both images
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx imagetools create \
          -t $_REPO:$SHORT_SHA \
          -t $_REPO:$_TAG_NAME \
          $_REPO:${SHORT_SHA}-amd64 \
          $_REPO:${SHORT_SHA}-arm64

images:
  - '$_REPO:${SHORT_SHA}-amd64'
  - '$_REPO:${SHORT_SHA}-arm64'
  - '$_REPO:$SHORT_SHA'
  - '$_REPO:$_TAG_NAME'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
