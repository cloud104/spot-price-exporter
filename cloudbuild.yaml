# cloudbuild.yaml - multi-arch build & push using docker buildx
substitutions:
  _TAG_NAME: "latest"
  _REPO: "us-east1-docker.pkg.dev/tks-gcr-pub/spot-price-exporter/spot-price-exporter"

steps:
  # enable binfmt for cross-platform emulation
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--privileged', 'tonistiigi/binfmt:latest', '--install', 'all']

  # create and use a buildx builder
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --use --name cbuilder || docker buildx use cbuilder

  # buildx multi-platform build and push to Artifact Registry repo ($_REPO)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - 'linux/amd64,linux/arm64'
      - '--push'
      - '--tag'
      - '$_REPO:$SHORT_SHA'
      - '--tag'
      - '$_REPO:$_TAG_NAME'
      - '--provenance=false'
      - '--sbom=false'
      - '.'

  # Verificar e validar as imagens após o push (opcional)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull $_REPO:$SHORT_SHA
        docker pull $_REPO:$_TAG_NAME

images:
  - '$_REPO:$SHORT_SHA'
  - '$_REPO:$_TAG_NAME'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
