# cloudbuild.yaml - Multi-arch build & push for Go binary (Dockerfile-based)

substitutions:
  _REPO: "us-east1-docker.pkg.dev/tks-gcr-pub/spot-price-exporter/spot-price-exporter"
  _TAG_NAME: "latest"

steps:
  # 1. Enable binfmt for cross-platform emulation
  - name: 'gcr.io/cloud-builders/docker'
    args: ['run', '--rm', '--privileged', 'tonistiigi/binfmt:latest', '--install', 'all']

  # 2. Create and use a buildx builder
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx create --use --name cbuilder || docker buildx use cbuilder

  # 3. Single multi-platform build & push -> produces a multi-arch manifest for the tags
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker buildx build \
          --platform=linux/amd64,linux/arm64 \
          --push \
          --tag=$_REPO:$SHORT_SHA \
          --tag=$_REPO:$_TAG_NAME \
          --provenance=false \
          --sbom=false \
          .

  # 4. Optional: inspect manifest and list pushed images
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Inspecting manifest for short sha:"
        docker buildx imagetools inspect $_REPO:$SHORT_SHA || true
        echo "Inspecting manifest for tag latest:"
        docker buildx imagetools inspect $_REPO:$_TAG_NAME || true

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Artifact Registry images:"
        gcloud artifacts docker images list ${_REPO%/*} --location=us-east1 || true

# no images: section to avoid Cloud Build final-image existence check
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
