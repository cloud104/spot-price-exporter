# cloudbuild.yaml - Multi-platform buildx template for "spot-price-calculator"
substitutions:
  _TAG_NAME: "latest"  # override with --substitutions=_TAG_NAME=your-tag when triggering

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'build-and-push'
  args:
    [
      'buildx', 'build', '--push',
      '--platform', 'linux/amd64,linux/arm64',
      '-t', 'gcr.io/$PROJECT_ID/spot-price-calculator:${_TAG_NAME}',
      '.'
    ]

images:
  - 'gcr.io/$PROJECT_ID/spot-price-calculator:${_TAG_NAME}'